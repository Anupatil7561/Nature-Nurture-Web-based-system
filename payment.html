<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Online Payment-Page</title>
    <link rel="stylesheet" href="payment.css">
</head>

<body>
    <div class="container">
            
                <form action="payment.php" method="POST">
                    <label for="card_number">Card Number:</label><br>
                    <input type="text" id="card_number" name="card_number" required><br><br>
            
                    <label for="expiration_date">Expiration Date:</label><br>
                    <input type="text" id="expiration_date" name="expiration_date" placeholder="MM/YY" required><br><br>
            
                    <label for="cvv">CVV:</label><br>
                    <input type="text" id="cvv" name="cvv" required><br><br>
            
                    <button onclick="donateTree()">Donate Now</button>
                </form>
    </div>
    <script>
        function donateTree() {
            
            const message = "Thank you for choosing to donate for planting a tree! Your support is helping to restore our planet. Every contribution matters!";
            
            alert(message);
            
           
        }
    </script>
    <script type="text/javascript" src="payment.js"></script>
</body>

</html>
